name: publish-production-container

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  packages: write

# Serialize publishers across commits. The current-main guard below also skips
# an older workflow_run that completes after a newer commit has reached main.
concurrency:
  group: mlac-container-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    # workflow_run is privileged: accept only a successful push to main. Never
    # publish a PR, scheduled run, or manually dispatched verification.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait for successful exact-SHA tests and CodeQL checks
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while true; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100")"
            set +e
            printf '%s' "$response" | python scripts/verify_publish_checks.py --expected-sha "$EXPECTED_SHA"
            result=$?
            set -e

            if [[ "$result" -eq 0 ]]; then
              break
            elif [[ "$result" -eq 1 ]]; then
              echo "::error::Refusing to publish ${EXPECTED_SHA}: a required check failed."
              exit 1
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::Refusing to publish ${EXPECTED_SHA}: required checks did not complete within 15 minutes."
              exit 1
            fi
            sleep 20
          done

      - name: Check whether the verified commit is still the main tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Verified commit ${EXPECTED_SHA} is no longer main (current: ${current_sha}); publishing only its immutable SHA tag."
          fi

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          IS_MAIN_TIP: ${{ steps.tip.outputs.is_tip }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${EXPECTED_SHA}"
            if [[ "$IS_MAIN_TIP" == "true" ]]; then
              echo "${IMAGE_NAME}:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish verified image tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
