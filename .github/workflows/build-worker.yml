name: build-and-publish-lm-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-worker.yml"
      - "worker/Dockerfile"
      - "worker/evaluate"
      - "worker/evaluate_lm"
      - "src/mlac/__init__.py"
      - "src/mlac/ir.py"
      - "src/mlac/registry.py"
      - "src/mlac/transformer.py"
      - "src/mlac/attestation.py"
      - "src/mlac/lm_evaluation.py"

permissions:
  contents: read
  packages: write

concurrency:
  group: mlac-lm-worker-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kunduruhimaneeshreddy/mlac-worker
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push immutable worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image digest and publish deployment reference
        env:
          IMAGE: ghcr.io/kunduruhimaneeshreddy/mlac-worker
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "Unexpected image digest: $DIGEST" >&2; exit 1 ;;
          esac
          {
            echo "## MLAC language-model worker"
            echo
            echo "Build commit: `$GITHUB_SHA`"
            echo
            echo "Immutable image reference:"
            echo
            echo "`$IMAGE@$DIGEST`"
            echo
            echo "Configure CandidateEvaluationPipeline with this exact reference; do not use the latest or sha tag."
            echo
            echo "SBOM and provenance attestations were requested from BuildKit."
          } >> "$GITHUB_STEP_SUMMARY"
