name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mlac-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mlac_test
          POSTGRES_USER: mlac
          POSTGRES_PASSWORD: mlac_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlac -d mlac_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MLAC_TEST_REDIS_URL: redis://localhost:6379/15
      MLAC_TEST_POSTGRES_URL: postgresql://mlac:mlac_test_password@localhost:5432/mlac_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client-16
      - run: pg_dump --version && pg_restore --version
      - run: pip install -e ".[dev,torch,api,production]"
      - run: python -m ruff check src/mlac/api.py src/mlac/cli.py src/mlac/training_engine.py src/mlac/pipeline.py src/mlac/dataset_manifest.py src/mlac/self_evolution.py src/mlac/evolution.py src/mlac/registry.py src/mlac/sqlite_state.py src/mlac/rate_limit.py src/mlac/postgres_state.py scripts/backup_state.py scripts/restore_postgres_backup.py scripts/migrate_sqlite_to_postgres.py tests/test_api.py tests/test_rate_limit.py tests/test_state_store.py tests/test_postgres_state.py tests/test_postgres_restore.py
      - run: pytest
      - run: docker build --pull -t mlac:ci .
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: mlac version
      - uses: actions/upload-artifact@v4
        with:
          name: mlac-1.0.0-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
