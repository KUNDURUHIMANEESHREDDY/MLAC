services:
  mlac:
    build:
      context: .
    image: mlac:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      MLAC_API_STATE_DB: /var/lib/mlac/api-state.sqlite3
      MLAC_RATE_LIMIT_REDIS_URL: ${MLAC_RATE_LIMIT_REDIS_URL:?Set a private Redis URL}
    volumes:
      - mlac-data:/var/lib/mlac
    expose:
      - "8000"
    networks:
      edge:
        ipv4_address: 172.30.0.3
      private: {}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --appendfsync always --save 60 1000 --requirepass "$$MLAC_REDIS_PASSWORD"'
    environment:
      MLAC_REDIS_PASSWORD: ${MLAC_REDIS_PASSWORD:?Set a strong Redis password}
    volumes:
      - redis-data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$MLAC_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      MLAC_DOMAIN: ${MLAC_DOMAIN:?Set the public MLAC domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.2
    depends_on:
      mlac:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  mlac-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  private:
    internal: true
