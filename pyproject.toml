[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "mlac"
version = "0.8.0"
description = "Governed model architecture engineering and evolution controller"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []
[project.optional-dependencies]
torch = ["torch>=2.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "PyJWT[crypto]>=2.14.0,<3"]
dev = ["pytest>=8", "ruff>=0.5", "cryptography>=42", "httpx>=0.27", "fastapi>=0.110", "PyJWT[crypto]>=2.14.0,<3"]
attestation = ["cryptography>=42"]
remote-storage = ["boto3>=1.34"]
[project.scripts]
mlac = "mlac.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/mlac"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
